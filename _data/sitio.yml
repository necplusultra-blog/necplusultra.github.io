# ---------------- Presentación ----------------
manifiesto:
  mostrar: true
  antetitulo: I. Presentación
  titulo: Nec plus ultra,
  titulo_acento: «no más allá».
  cuerpo: |
    *Nec plus ultra* era la inscripción que señalaba el límite del mundo conocido. Aquí se la lee a contrapelo: como pregunta por los límites inmanentes del capital y por lo que podría existir más allá de ellos.

    Los textos reunidos en este sitio se ocupan de la crisis estructural del capitalismo global, de sus expresiones autoritarias —de la neorreacción y la Ilustración Oscura a la ofensiva burguesa en el Chile actual— y de la pregunta por la transformación social radical después de la revuelta.
  cita: La crítica despiadada de todo lo existente; despiadada en el sentido de que no teme a sus propios resultados ni al conflicto con los poderes existentes.
  cita_autor: Karl Marx, carta a Arnold Ruge, 1843
  cuerpo_final: |
    Los ensayos proceden del blog **Nec plus ultra** y se complementan con el libro *Revuelta, capital y praxis social* y con las grabaciones del taller de lectura de *El Capital*.
  ejes:
    - titulo: Crisis
      texto: Los límites inmanentes del capital y la crisis estructural del capitalismo tardío.
    - titulo: Barbarie
      texto: Neorreacción, Ilustración Oscura y ofensiva autoritaria como expresiones de la crisis.
    - titulo: Emancipación
      texto: Revuelta, insurrección y comunización. Las posibilidades de la transformación social radical.

# ---------------- Sobre el símbolo ----------------
simbolo:
  titulo: Sobre el emblema
  texto: |
    La hoz y el martillo, en hierro gastado, nombran a quienes trabajan la tierra y la fábrica. Sobre ellos se alza la A de la anarquía hecha cortacadenas: una herramienta que no fabrica nada, sino que rompe; su travesaño es la cadena ya cortada. El círculo que la encierra es un anillo de zarzas.

    De las espinas brotan rosas oscuras. La emancipación no aparece como dominio productivista sobre la naturaleza, sino como ruptura de las cadenas y reparación de la fractura metabólica que el capital abre entre la sociedad y la tierra: Marx advertía que la producción capitalista socava al mismo tiempo la tierra y al trabajador.

