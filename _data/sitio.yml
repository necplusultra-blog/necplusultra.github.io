manifiesto:
  mostrar: true
  antetitulo: I. Presentación
  titulo: Nec plus ultra,
  titulo_acento: «no más allá».
  cuerpo: >-
    *Nec plus ultra* era la inscripción que señalaba el límite del mundo
    conocido. Aquí se la lee a contrapelo: como pregunta por los límites
    inmanentes del capital y por lo que podría existir más allá de ellos.


    Los textos reunidos en este sitio se ocupan de la crisis estructural del
    capitalismo global, de sus expresiones autoritarias —de la neorreacción y la
    Ilustración Oscura a la ofensiva burguesa en el Chile actual— y de la
    pregunta por la transformación social radical después de la revuelta.
  cita: La crítica despiadada de todo lo existente; despiadada en el sentido de
    que no teme a sus propios resultados ni al conflicto con los poderes
    existentes.
  cita_autor: Karl Marx, carta a Arnold Ruge, 1843
  cuerpo_final: Los ensayos proceden del blog **Nec plus ultra** y se complementan
    con el libro *Revuelta, capital y praxis social* y con las grabaciones del
    taller de lectura de *El Capital*.
  ejes:
    - titulo: Crisis
      texto: Los límites inmanentes del capital y la crisis estructural del
        capitalismo tardío.
    - titulo: Barbarie
      texto: Neorreacción, Ilustración Oscura y ofensiva autoritaria como expresiones
        de la crisis.
    - titulo: Emancipación
      texto: Revuelta, insurrección y comunización. Las posibilidades de la
        transformación social radical.
simbolo:
  titulo: Sobre la imagen
  texto: "El retrato de Marx con la mirada encendida acompaña a *Nec plus ultra*
    desde su primera etapa. No es una imagen de culto, sino una provocación: la
    crítica de la economía política leída desde el presente, con los ojos
    puestos en las formas actuales de dominación."
