{%- assign l = include.l -%}
{%- if l.portada and l.portada != "" -%}
<img src="{{ l.portada | relative_url }}" alt="Portada de {{ l.title | escape }}" loading="lazy" class="w-full h-auto border hairline shadow-[0_30px_60px_-30px_rgba(0,0,0,.7)]" />
{%- else -%}
<div class="portada-tipo w-full aspect-[2/3] border hairline bg-surface2 p-6 sm:p-7 flex flex-col">
  <span class="kicker !text-accent">{{ site.data.sitio.nombre }} {{ site.data.sitio.nombre_acento }}</span>
  <span class="block w-10 h-px bg-accent my-auto"></span>
  <p class="font-serif text-2xl leading-tight text-ink">{{ l.title }}</p>
  <p class="text-xs text-muted mt-3">{{ l.autores }}</p>
</div>
{%- endif -%}
